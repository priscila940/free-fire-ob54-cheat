name: Build Free Fire OB54 Cheat

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4  # Updated from v3 to v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r build/requirements.txt
    
    - name: Build executable
      run: |
        pyinstaller --onefile --noconsole --name free_fire_ob54_cheat src/free_fire_ob54_cheat.py
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4  # Updated from v3 to v4
      with:
        name: free-fire-ob54-cheat-exe
        path: dist/free_fire_ob54_cheat.exe
